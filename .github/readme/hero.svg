<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Skyshift — watch the SPHEREx sky change</title>
  <desc id="desc">Animated night sky with purple and cyan nebulae, a two-epoch blink comparator in which a moving dot jumps between frames, and a 0.75 to 5.0 micron spectral band with a scanning channel marker.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/>
      <stop offset=".52" stop-color="#071238"/>
      <stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".66"/>
      <stop offset=".34" stop-color="#8d22ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanCloud">
      <stop stop-color="#7ff3ff" stop-opacity=".5"/>
      <stop offset=".35" stop-color="#22c3e6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0a5a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/>
      <stop offset=".28" stop-color="#ffe293"/>
      <stop offset=".55" stop-color="#f4bb4d"/>
      <stop offset=".82" stop-color="#fff0b7"/>
      <stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6f2cff"/>
      <stop offset=".25" stop-color="#BD3CFF"/>
      <stop offset=".5" stop-color="#3fe0ff"/>
      <stop offset=".75" stop-color="#F4C65A"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".45" stop-color="#7fdcff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#f6c35b" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#bff6ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#c68cff" opacity=".78"/>
    </pattern>
    <pattern id="frameStars" width="60" height="50" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="9" r="1.1" fill="#e9fbff" opacity=".85"/>
      <circle cx="38" cy="22" r=".7" fill="#ffe7a2" opacity=".7"/>
      <circle cx="22" cy="40" r=".9" fill="#c9b5ff" opacity=".7"/>
      <circle cx="52" cy="44" r=".5" fill="#fff" opacity=".6"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000017" flood-opacity=".8"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="34"/></clipPath>
    <clipPath id="frameA"><rect x="0" y="0" width="180" height="150" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="260" cy="130" rx="340" ry="210" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="310;380;310" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="260" rx="330" ry="200" fill="url(#cyanCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="175;235;175" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="520" fill="url(#stars)" opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <!-- Blink comparator: two epochs of the same patch of sky -->
    <g transform="translate(770 70)" filter="url(#shadow)">
      <g>
        <rect width="180" height="150" rx="14" fill="#04061d" stroke="#3fe0ff" stroke-opacity=".55"/>
        <g clip-path="url(#frameA)"><rect width="180" height="150" fill="url(#frameStars)"/></g>
        <circle cx="62" cy="96" r="5" fill="#7ff3ff" filter="url(#glow)">
          <animate attributeName="opacity" values="1;1;.15;.15;1" keyTimes="0;.45;.5;.95;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="12" y="20" fill="#bff6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">EPOCH 1</text>
      </g>
      <g transform="translate(200 0)">
        <rect width="180" height="150" rx="14" fill="#04061d" stroke="#F4C65A" stroke-opacity=".6"/>
        <g clip-path="url(#frameA)"><rect width="180" height="150" fill="url(#frameStars)"/></g>
        <circle cx="62" cy="96" r="5" fill="none" stroke="#7ff3ff" stroke-opacity=".45" stroke-dasharray="2 3"/>
        <path d="M67 92 L118 58" stroke="#F4C65A" stroke-width="1.2" stroke-dasharray="3 4" opacity=".7">
          <animate attributeName="stroke-dashoffset" values="14;0" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <circle cx="122" cy="55" r="5" fill="#ffe293" filter="url(#glow)">
          <animate attributeName="opacity" values=".15;.15;1;1;.15" keyTimes="0;.45;.5;.95;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="12" y="20" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5">EPOCH 2</text>
      </g>
      <text x="0" y="178" fill="#bba7e6" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.4">BLINK · SAME SKY · TWO DATES · SOMETHING MOVED</text>
    </g>

    <!-- Spectral band: SPHEREx covers 0.75–5.0 µm -->
    <g transform="translate(770 290)">
      <rect width="380" height="16" rx="8" fill="url(#spectrum)" opacity=".85"/>
      <rect width="380" height="16" rx="8" fill="none" stroke="#fff0b7" stroke-opacity=".35"/>
      <rect x="0" y="-6" width="3" height="28" rx="1.5" fill="#ffffff" filter="url(#glow)">
        <animate attributeName="x" values="4;373;4" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="40" fill="#bff6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">CH 001 · 0.75 µm</text>
      <text x="380" y="40" text-anchor="end" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.2">CH 102 · 5.00 µm</text>
    </g>

    <!-- Identity panel -->
    <g filter="url(#shadow)">
      <rect x="56" y="52" width="660" height="316" rx="28" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".82"/>
      <rect x="68" y="64" width="636" height="292" rx="22" fill="url(#glass)" stroke="#7fdcff" stroke-opacity=".22"/>
    </g>
    <path d="M96 102H318" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="96" cy="102" r="5" fill="#7ff3ff" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="114" y="107" fill="#f9d777" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3">NASA SPACE APPS 2026 / PLANET X AND SPHEREx</text>
    <text x="94" y="192" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="4">SKYSHIFT</text>
    <text x="98" y="236" fill="#9eeeff" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="700" letter-spacing="5">SEE HOW THE SKY CHANGES</text>
    <text x="98" y="276" fill="#d9c7f2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17">Real SPHEREx images from NASA IRSA, blinked across time.</text>

    <g transform="translate(98 304)">
      <rect width="168" height="40" rx="20" fill="#0a1a38" fill-opacity=".8" stroke="#3fe0ff" stroke-opacity=".7"/>
      <circle cx="21" cy="20" r="5" fill="#3fe0ff" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="36" y="25" fill="#cff8ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">REAL ARCHIVE</text>
    </g>
    <g transform="translate(280 304)">
      <rect width="172" height="40" rx="20" fill="#1d1732" fill-opacity=".8" stroke="#f3c454" stroke-opacity=".65"/>
      <text x="20" y="25" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">EVERY PIXEL CITED</text>
    </g>
    <g transform="translate(466 304)">
      <rect width="196" height="40" rx="20" fill="#111331" fill-opacity=".8" stroke="#9f62ff" stroke-opacity=".66"/>
      <text x="20" y="25" fill="#dcc9ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">OPEN · NO LOGIN</text>
    </g>

    <rect x="0" y="0" width="1200" height="420" rx="34" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="400" rx="27" fill="none" stroke="#3fe0ff" stroke-opacity=".14"/>
    <rect x="0" y="-45" width="1200" height="34" fill="#7ff3ff" opacity=".04"><animate attributeName="y" values="-45;450" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
