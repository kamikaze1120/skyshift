name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  file-guard:
    name: Block large / raw FITS files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject files over 5MB or raw .fits files
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          changed=$(git diff --name-only "$base" "$head" || true)
          fail=0
          for f in $changed; do
            [ -f "$f" ] || continue
            case "$f" in
              *.fits|*.FITS)
                echo "::error file=$f::Raw FITS files are not allowed — convert to a web image first."
                fail=1
                ;;
            esac
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$f::File exceeds 5MB ($size bytes)."
              fail=1
            fi
          done
          exit $fail

  pr-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
