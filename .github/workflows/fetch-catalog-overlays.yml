name: Fetch catalog overlays (one-off)

# Temporary: runs scripts/fetch_catalog_overlays.py on a GitHub-hosted runner,
# which has normal outbound internet access (unlike the sandboxed dev
# environment this was authored in, where Gaia's TAP service was
# unreachable). Delete this workflow once the fixture has real data.

on:
  workflow_dispatch: {}
  push:
    branches: [mujtaba/story-overhaul]
    paths: ['.github/workflows/fetch-catalog-overlays.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python scripts/fetch_catalog_overlays.py

      - name: Commit and push if the fixture changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/fixtures/catalogOverlays.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: re-fetch Gaia DR3 / JPL SBDB catalog overlays from CI runner"
            git push
          fi
